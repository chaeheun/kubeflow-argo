apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-controller
spec:
  template:
    spec:
      containers:
        - name: workflow-controller
          image: gcr.io/ml-pipeline/workflow-controller:v3.4.17-license-compliance
          args:
            - --configmap
            - workflow-controller-configmap
            - --executor-image
            # gcr.io/ml-pipeline/argoexec 이미지가 삭제되어 업스트림 argoexec(같은 v3.4.17)으로 대체
            - quay.io/argoproj/argoexec:v3.4.17
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
          resources:
            requests:
              cpu: 100m
              memory: 500Mi
          env:
            - name: LEADER_ELECTION_DISABLE
              value: "true"
