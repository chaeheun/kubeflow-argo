# MinIO 웹 콘솔(9001)을 LAN에 노출하는 NodePort 서비스. S3 API용 minio-service(9000)는 ClusterIP 그대로 둔다.
apiVersion: v1
kind: Service
metadata:
  name: minio-console
spec:
  type: NodePort
  ports:
  - name: console
    port: 9001
    protocol: TCP
    targetPort: 9001
    nodePort: 30009
  selector:
    app: minio
