# KFP 2.4.0 매니페스트는 minio를 runAsUser 1000(runAsNonRoot)으로 실행하는데 PVC 데이터 디렉터리는
# 이전 실행의 소유자(root, 65532 등)라 쓰기에 실패한다. local-path(hostPath 계열)는 fsGroup이 적용되지 않으므로
# root로 실행하는 initContainer가 소유권을 맞춘다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  template:
    spec:
      initContainers:
      - name: fix-data-permissions
        image: docker.io/library/busybox:1.36.1
        command: ["sh", "-c", "chown -R 1000:0 /data"]
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: data
          mountPath: /data
          subPath: minio
