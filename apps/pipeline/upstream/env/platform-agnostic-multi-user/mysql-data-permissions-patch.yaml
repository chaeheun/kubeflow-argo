# KFP 2.4.0 매니페스트는 mysql을 runAsUser 1000(runAsNonRoot)으로 실행하는데 PVC 데이터는
# 이전에 uid 999로 만들어져 있어 "auto.cnf ... Permission denied"로 기동에 실패한다.
# local-path(hostPath 계열)는 fsGroup이 적용되지 않으므로 root로 실행하는 initContainer가 소유권을 맞춘다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  template:
    spec:
      initContainers:
      - name: fix-data-permissions
        image: docker.io/library/busybox:1.36.1
        command: ["sh", "-c", "chown -R 1000:0 /var/lib/mysql"]
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: mysql-persistent-storage
          mountPath: /var/lib/mysql
