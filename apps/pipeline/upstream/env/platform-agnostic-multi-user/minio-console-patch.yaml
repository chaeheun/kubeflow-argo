# MinIO 웹 콘솔 포트를 9001로 고정한다. 지정하지 않으면 콘솔이 기동 때마다 임의 포트로 뜬다.
# args 리스트는 병합되지 않고 통째로 교체되므로 기존 인자(server /data)도 함께 적는다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  template:
    spec:
      containers:
      - name: minio
        args:
        - server
        - /data
        - --console-address
        - :9001
        ports:
        - containerPort: 9001
          name: console
