apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: knative
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gasida/kubeflow-argo.git
    targetRevision: main
    path: common/knative
  destination:
    server: https://kubernetes.default.svc
  # knative webhook 컨트롤러가 웹훅 설정의 rules를 그룹/버전별로 다시 써서 selfHeal과 계속 충돌하므로 rules만 비교에서 제외한다.
  ignoreDifferences:
  - group: admissionregistration.k8s.io
    kind: MutatingWebhookConfiguration
    name: webhook.serving.knative.dev
    jsonPointers:
    - /webhooks/0/rules
  - group: admissionregistration.k8s.io
    kind: ValidatingWebhookConfiguration
    name: validation.webhook.serving.knative.dev
    jsonPointers:
    - /webhooks/0/rules
  - group: admissionregistration.k8s.io
    kind: MutatingWebhookConfiguration
    name: webhook.domainmapping.serving.knative.dev
    jsonPointers:
    - /webhooks/0/rules
  - group: admissionregistration.k8s.io
    kind: ValidatingWebhookConfiguration
    name: validation.webhook.domainmapping.serving.knative.dev
    jsonPointers:
    - /webhooks/0/rules
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - RespectIgnoreDifferences=true
