apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notebook-controller
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gasida/kubeflow-argo.git
    targetRevision: main
    path: apps/jupyter/notebook-controller/upstream/overlays/kubeflow
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    # Notebook CRD가 커서(256KB 초과) client-side apply 어노테이션 한도를 넘는다
    - ServerSideApply=true
