apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-profiles
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gasida/kubeflow-argo.git
    targetRevision: main
    path: common/user-namespace/base
  destination:
    server: https://kubernetes.default.svc
    namespace: kubeflow  # ConfigMap(default-install-config)에 네임스페이스가 없어 지정 필요
  syncPolicy:
    automated:
      prune: true
      selfHeal: true